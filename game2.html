<!DOCTYPE html>

<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Game 2 | Guess the Number</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:Arial,sans-serif;

  background:linear-gradient(135deg,#21113f,#4b247d);

  min-height:100vh;

  padding:20px;

}

.game{

  max-width:520px;

  margin:40px auto;

  background:white;

  border-radius:25px;

  padding:25px;

  text-align:center;

  box-shadow:0 18px 45px rgba(0,0,0,.3);

}

.brand{

  font-weight:bold;

  color:#21113f;

  letter-spacing:1px;

}

h1{

  margin:10px 0;

}

.score{

  font-size:21px;

  font-weight:bold;

  background:#f3eff9;

  padding:13px;

  border-radius:14px;

  margin:18px 0;

}

.hint{

  font-size:20px;

  font-weight:bold;

  min-height:30px;

  margin:18px 0;

}

input{

  width:100%;

  padding:15px;

  border:1px solid #ccc;

  border-radius:12px;

  font-size:18px;

  text-align:center;

  margin-bottom:12px;

}

button{

  width:100%;

  padding:15px;

  border:0;

  border-radius:12px;

  background:#21113f;

  color:white;

  font-size:16px;

  font-weight:bold;

  margin-top:8px;

}

.hidden{

  display:none;

}

.win{

  font-size:22px;

  font-weight:bold;

}

.small{

  font-size:13px;

  color:#666;

  line-height:1.4;

  margin-top:20px;

}

</style>

</head>

<body>

<div class="game">

<div class="brand">🎮 PLAY & EARN</div>

<h1>🎯 Guess the Number</h1>

<p>

I'm thinking of a number from <strong>1 to 20</strong>.

</p>

<div class="score">

⭐ Saved Points: <span id="score">0</span>

</div>

<div id="play">

<input

id="guess"

type="number"

min="1"

max="20"

placeholder="Enter 1–20"

>

<button onclick="guessNumber()">

Submit Guess

</button>

<div id="hint" class="hint"></div>

<div>

Attempts: <span id="attempts">0</span>

</div>

</div>

<div id="win" class="hidden">

<p class="win">🎉 You got it!</p>

<p>

You earned <strong>10 points</strong>.

</p>

<button onclick="newRound()">

🔄 Play Again

</button>

</div>

<p class="small">

Your points are saved on this device.

They are game points and are not automatically cash.

</p>

</div>

<script>

let name = localStorage.getItem("playerName");

if(!name){

  name = prompt("Enter your player name");

  if(name){

    name = name.trim();

    localStorage.setItem("playerName",name);

  }

}

let score =

Number(localStorage.getItem("points_"+name) || 0);

let target =

Math.floor(Math.random()*20)+1;

let attempts = 0;

document.getElementById("score").textContent = score;

function guessNumber(){

  let guess =

  Number(document.getElementById("guess").value);

  if(!guess || guess < 1 || guess > 20){

    document.getElementById("hint").textContent =

    "Enter a number from 1 to 20.";

    return;

  }

  attempts++;

  document.getElementById("attempts").textContent =

  attempts;

  if(guess === target){

    score += 10;

    localStorage.setItem(

      "points_"+name,

      score

    );

    document.getElementById("score").textContent =

    score;

    document.getElementById("play")

    .classList.add("hidden");

    document.getElementById("win")

    .classList.remove("hidden");

  }

  else if(guess < target){

    document.getElementById("hint").textContent =

    "⬆️ Too low! Try higher.";

  }

  else{

    document.getElementById("hint").textContent =

    "⬇️ Too high! Try lower.";

  }

}

function newRound(){

  target =

  Math.floor(Math.random()*20)+1;

  attempts = 0;

  document.getElementById("attempts").textContent =

  0;

  document.getElementById("guess").value = "";

  document.getElementById("hint").textContent = "";

  document.getElementById("play")

  .classList.remove("hidden");

  document.getElementById("win")

  .classList.add("hidden");

}

</script>

</body>

</html>
