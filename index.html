<!DOCTYPE html>

<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Play & Earn - Game 1</title>

<style>

body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#21113f,#4b247d);min-height:100vh;padding:20px}

.game{max-width:560px;margin:30px auto;background:white;border-radius:25px;padding:25px;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.3)}

button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;background:#21113f;color:white;font-size:17px;font-weight:bold}

.option{background:#eee7f7;color:#21113f}

.score{background:#f3eff9;padding:14px;border-radius:14px;font-weight:bold;margin:18px 0}

#message{min-height:28px;font-weight:bold;margin:15px}

</style>

</head>

<body>

<div class="game">

<h1>🎮 Play & Earn</h1>

<p>🧠 Game 1: Trivia Challenge</p>

<div class="score">⭐ Points: <span id="score">0</span></div>
<div class="score">

  🎁 Rewards

  <br>

  <span id="reward">Keep playing to earn rewards!</span>

</div>
<h2 id="question"></h2>

<div id="answers"></div>

<div id="message"></div>

</div>
<br>

<a href="game2.html">

<button>🎯 Game 2 — Guess the Number</button>

</a>

<a href="game3.html">

<button>🎡 Game 3 — Spin the Wheel</button>

</a>

<a href="game4.html">

<button>💰 Game 4 — Pick a Box</button>

</a>







</a><script>

let score=Number(localStorage.getItem("playEarnPoints")||0);

let current=0;

const questions=[

{

q:"What is the largest planet in our solar system?",

a:["Mars","Earth","Jupiter","Venus"],

c:"Jupiter"

},

{

q:"How many days are in a week?",

a:["5","6","7","8"],

c:"7"

},

{

q:"Which animal is the fastest land animal?",

a:["Lion","Cheetah","Horse","Tiger"],

c:"Cheetah"

}

];
document.getElementById("score").textContent=score;
  document.getElementById("reward").textContent =

  score >= 100 ? "🏆 You reached 100 points!" :

  score >= 50 ? "🎁 You're halfway to 100 points!" :

  "⭐ Keep playing to earn more!";

function showQuestion(){

let q=questions[current];

document.getElementById("question").textContent=q.q;

document.getElementById("message").textContent="";

let box=document.getElementById("answers");

box.innerHTML="";

q.a.forEach(answer=>{

let button=document.createElement("button");

button.className="option";

button.textContent=answer;

button.onclick=()=>checkAnswer(answer);

box.appendChild(button);

});

}

function checkAnswer(answer){

let q=questions[current];

if(answer===q.c){

score+=10;

localStorage.setItem("playEarnPoints",score);

document.getElementById("score").textContent=score;

document.getElementById("message").textContent="🎉 Correct! You earned 10 points!";

}else{

document.getElementById("message").textContent="❌ Not quite!";

}

current++;

if(current>=questions.length){

current=0;

}

setTimeout(showQuestion,1000);

}

showQuestion();

</script>

</body>

</html>
